```html
<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Travel Day — Smart Journey Companion</title>

    <!-- Premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap"
      rel="stylesheet"
    />

    <!-- Premium theme variables -->
    <style>
      :root {
        --background: #07111f;
        --background-soft: #0b1728;
        --surface: #101d30;
        --surface-light: #16263c;

        --primary: #4f8cff;
        --primary-light: #79aaff;
        --secondary: #25d9c4;
        --accent: #f4c76b;

        --text-primary: #f8fafc;
        --text-secondary: #a9b7ca;
        --text-muted: #718198;

        --border: rgba(255, 255, 255, 0.08);
        --glass: rgba(16, 29, 48, 0.72);

        --shadow:
          0 20px 60px rgba(0, 0, 0, 0.35);

        --gradient-primary:
          linear-gradient(135deg, #4f8cff 0%, #25d9c4 100%);

        --gradient-premium:
          linear-gradient(
            135deg,
            #111f35 0%,
            #0c192b 45%,
            #07111f 100%
          );
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background: var(--background);
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;

        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(79, 140, 255, 0.13),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(37, 217, 196, 0.09),
            transparent 28%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(79, 140, 255, 0.06),
            transparent 35%
          ),
          var(--background);

        color: var(--text-primary);

        font-family: "DM Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
      }

      /* Premium scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--background);
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          var(--primary),
          var(--secondary)
        );
        border-radius: 999px;
      }

      ::selection {
        background: rgba(79, 140, 255, 0.3);
        color: white;
      }

      /* Material icons */
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 500,
          "GRAD" 0,
          "opsz" 24;
      }

      /* Glass surfaces */
      .glass {
        background: var(--glass);
        border: 1px solid var(--border);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      /* Premium card */
      .premium-card {
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.06),
            rgba(255, 255, 255, 0.015)
          ),
          var(--surface);

        border: 1px solid var(--border);
        border-radius: 20px;

        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);

        transition:
          transform 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .premium-card:hover {
        transform: translateY(-3px);

        border-color: rgba(79, 140, 255, 0.28);

        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.3),
          0 0 30px rgba(79, 140, 255, 0.05);
      }

      /* Primary gradient text */
      .gradient-text {
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Premium button */
      .premium-button {
        background: var(--gradient-primary);
        color: #ffffff;

        border: none;
        border-radius: 12px;

        padding: 12px 20px;

        font-family: "DM Sans", sans-serif;
        font-weight: 700;

        cursor: pointer;

        box-shadow:
          0 8px 25px rgba(79, 140, 255, 0.2);

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .premium-button:hover {
        transform: translateY(-2px);

        box-shadow:
          0 12px 30px rgba(79, 140, 255, 0.3);
      }

      /* Soft accent glow */
      .glow-blue {
        box-shadow:
          0 0 0 1px rgba(79, 140, 255, 0.12),
          0 0 35px rgba(79, 140, 255, 0.08);
      }

      .glow-teal {
        box-shadow:
          0 0 0 1px rgba(37, 217, 196, 0.12),
          0 0 35px rgba(37, 217, 196, 0.08);
      }

      /* Smooth transitions */
      button,
      a,
      input,
      select,
      textarea {
        transition: all 0.2s ease;
      }

      /* Inputs */
      input,
      textarea,
      select {
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: 12px;
        outline: none;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: rgba(79, 140, 255, 0.55);
        box-shadow:
          0 0 0 3px rgba(79, 140, 255, 0.08);
      }

      /* Subtle page noise */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.025;

        background-image:
          url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      }

      /* Mobile */
      @media (max-width: 768px) {
        body {
          background:
            radial-gradient(
              circle at 50% 0%,
              rgba(79, 140, 255, 0.12),
              transparent 35%
            ),
            var(--background);
        }

        .premium-card {
          border-radius: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
