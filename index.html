```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Travel Day - Smart Journey Companion</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --navy: #102a43;
        --blue: #1683e8;
        --sky: #eaf6ff;
        --orange: #ff8a4c;
        --yellow: #ffc857;
        --cream: #fffaf5;
        --text: #102a43;
        --muted: #627d98;
        --white: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(
            circle at 10% 10%,
            rgba(22, 131, 232, 0.12),
            transparent 28%
          ),
          radial-gradient(
            circle at 90% 20%,
            rgba(255, 138, 76, 0.13),
            transparent 25%
          ),
          var(--cream);

        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Soft decorative circles */

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        z-index: -1;
      }

      body::before {
        background: rgba(22, 131, 232, 0.12);
        top: -150px;
        left: -120px;
      }

      body::after {
        background: rgba(255, 138, 76, 0.1);
        right: -120px;
        bottom: -150px;
      }

      /* Root */

      #root {
        min-height: 100vh;
      }

      /* Selection */

      ::selection {
        background: var(--blue);
        color: white;
      }

      /* Scrollbar */

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f4f8fb;
      }

      ::-webkit-scrollbar-thumb {
        background: #9ccff4;
        border-radius: 20px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--blue);
      }

      /* Common glass effect */

      .glass {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 15px 40px rgba(16, 42, 67, 0.08);
      }

      /* Cards */

      .travel-card {
        background: white;
        border: 1px solid #e8f0f6;
        border-radius: 24px;
        box-shadow: 0 12px 35px rgba(16, 42, 67, 0.07);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease,
          border-color 0.3s ease;
      }

      .travel-card:hover {
        transform: translateY(-6px);
        border-color: #b9ddf8;
        box-shadow: 0 20px 45px rgba(16, 42, 67, 0.12);
      }

      /* Primary button */

      .primary-button {
        background: linear-gradient(
          135deg,
          #1683e8,
          #0875d1
        );

        color: white;
        border: none;
        border-radius: 14px;
        padding: 13px 22px;
        font-weight: 600;

        box-shadow:
          0 8px 20px rgba(22, 131, 232, 0.25);

        transition: all 0.25s ease;
      }

      .primary-button:hover {
        transform: translateY(-2px);
        box-shadow:
          0 12px 25px rgba(22, 131, 232, 0.35);
      }

      /* Secondary button */

      .secondary-button {
        background: white;
        color: var(--navy);
        border: 1px solid #dbe9f3;
        border-radius: 14px;
        padding: 12px 20px;
        font-weight: 600;
        transition: all 0.25s ease;
      }

      .secondary-button:hover {
        background: var(--sky);
        border-color: #b8dcf5;
      }

      /* Accent badge */

      .travel-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border-radius: 999px;

        background: #fff1e8;
        color: #d86127;

        font-size: 12px;
        font-weight: 700;
      }

      /* Icon containers */

      .blue-icon {
        background: #e7f4ff;
        color: #1683e8;
      }

      .orange-icon {
        background: #fff0e7;
        color: #ef762f;
      }

      .yellow-icon {
        background: #fff7d9;
        color: #d99b00;
      }

      .green-icon {
        background: #e8f8ef;
        color: #23945a;
      }

      /* Destination image */

      .destination-image {
        overflow: hidden;
        border-radius: 20px;
      }

      .destination-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
      }

      .travel-card:hover .destination-image img {
        transform: scale(1.06);
      }

      /* Gradient hero */

      .hero-gradient {
        background:
          linear-gradient(
            120deg,
            rgba(16, 42, 67, 0.96),
            rgba(20, 83, 130, 0.9)
          );
      }

      /* Floating travel element */

      .floating-travel {
        animation: floating 4s ease-in-out infinite;
      }

      @keyframes floating {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }
      }

      /* Fade entrance */

      .fade-up {
        animation: fadeUp 0.7s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Mobile */

      @media (max-width: 768px) {
        body {
          background: var(--cream);
        }

        .travel-card {
          border-radius: 20px;
        }
      }

      /* Accessibility */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
```
