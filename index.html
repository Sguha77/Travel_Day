```html
<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Travel Day - Smart Journey Companion</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      * {
        scroll-behavior: smooth;
      }

      body {
        overflow-x: hidden;
      }

      /* ---------------------------
         PAGE ENTRANCE
      ---------------------------- */
      .page-enter {
        animation: pageEnter 0.9s ease-out forwards;
      }

      @keyframes pageEnter {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ---------------------------
         FLOATING BACKGROUND
      ---------------------------- */
      .travel-orb {
        position: fixed;
        border-radius: 9999px;
        pointer-events: none;
        filter: blur(70px);
        opacity: 0.35;
        z-index: -1;
      }

      .orb-one {
        width: 280px;
        height: 280px;
        background: #ff9f7f;
        top: 8%;
        left: -100px;
        animation: orbMove 10s ease-in-out infinite alternate;
      }

      .orb-two {
        width: 320px;
        height: 320px;
        background: #9bbcff;
        right: -120px;
        top: 35%;
        animation: orbMove 13s ease-in-out infinite alternate-reverse;
      }

      .orb-three {
        width: 240px;
        height: 240px;
        background: #ffd66b;
        bottom: 5%;
        left: 40%;
        animation: orbMove 12s ease-in-out infinite alternate;
      }

      @keyframes orbMove {
        from {
          transform: translate(0, 0) scale(1);
        }

        to {
          transform: translate(60px, -40px) scale(1.15);
        }
      }

      /* ---------------------------
         FLOATING CLOUDS
      ---------------------------- */
      .cloud {
        position: absolute;
        opacity: 0.55;
        animation: cloudMove linear infinite;
      }

      .cloud-one {
        top: 15%;
        left: -200px;
        animation-duration: 35s;
      }

      .cloud-two {
        top: 30%;
        left: -300px;
        animation-duration: 45s;
        animation-delay: 8s;
      }

      @keyframes cloudMove {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(calc(100vw + 500px));
        }
      }

      /* ---------------------------
         AIRPLANE
      ---------------------------- */
      .plane {
        animation: flyPlane 7s ease-in-out infinite;
      }

      @keyframes flyPlane {
        0% {
          transform: translate(-30px, 20px) rotate(-8deg);
          opacity: 0;
        }

        15% {
          opacity: 1;
        }

        50% {
          transform: translate(45vw, -20px) rotate(-3deg);
          opacity: 1;
        }

        85% {
          opacity: 1;
        }

        100% {
          transform: translate(105vw, -80px) rotate(-8deg);
          opacity: 0;
        }
      }

      .flight-line {
        width: 180px;
        border-top: 2px dashed rgba(30, 64, 175, 0.25);
        transform: rotate(-8deg);
        animation: lineFade 7s ease-in-out infinite;
      }

      @keyframes lineFade {
        0%,
        100% {
          opacity: 0;
        }

        30%,
        70% {
          opacity: 1;
        }
      }

      /* ---------------------------
         HERO TEXT
      ---------------------------- */
      .hero-title {
        background: linear-gradient(
          90deg,
          #111827,
          #2563eb,
          #7c3aed,
          #111827
        );

        background-size: 300% auto;

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        animation: gradientText 6s linear infinite;
      }

      @keyframes gradientText {
        to {
          background-position: 300% center;
        }
      }

      /* ---------------------------
         FLOATING CARDS
      ---------------------------- */
      .floating-card {
        animation: floatingCard 4s ease-in-out infinite;
      }

      .floating-card:nth-child(2) {
        animation-delay: 1s;
      }

      .floating-card:nth-child(3) {
        animation-delay: 2s;
      }

      @keyframes floatingCard {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }

        50% {
          transform: translateY(-12px) rotate(1deg);
        }
      }

      /* ---------------------------
         CARD HOVER
      ---------------------------- */
      .travel-card {
        transition:
          transform 0.35s ease,
          box-shadow 0.35s ease,
          border-color 0.35s ease;
      }

      .travel-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow:
          0 25px 50px rgba(0, 0, 0, 0.12),
          0 0 0 1px rgba(59, 130, 246, 0.15);
      }

      /* ---------------------------
         IMAGE ZOOM
      ---------------------------- */
      .destination-image {
        transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .travel-card:hover .destination-image {
        transform: scale(1.08);
      }

      /* ---------------------------
         BUTTON
      ---------------------------- */
      .travel-button {
        position: relative;
        overflow: hidden;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .travel-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(37, 99, 235, 0.3);
      }

      .travel-button::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 80%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        transform: skewX(-20deg);
        transition: left 0.7s ease;
      }

      .travel-button:hover::after {
        left: 140%;
      }

      /* ---------------------------
         SCROLL INDICATOR
      ---------------------------- */
      .scroll-dot {
        animation: scrollDot 2s ease-in-out infinite;
      }

      @keyframes scrollDot {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }

        50% {
          transform: translateY(7px);
          opacity: 1;
        }
      }

      /* ---------------------------
         REDUCED MOTION
      ---------------------------- */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body
    class="bg-[#fcf8fb] dark:bg-[#1b1b1d] text-[#1b1b1d] dark:text-[#f3f0f2] font-['Inter',sans-serif] antialiased"
  >

    <!-- Animated background -->
    <div class="travel-orb orb-one"></div>
    <div class="travel-orb orb-two"></div>
    <div class="travel-orb orb-three"></div>

    <div
      class="fixed inset-0 pointer-events-none overflow-hidden -z-10"
      aria-hidden="true"
    >
      <!-- Clouds -->
      <div class="cloud cloud-one">
        <span class="material-symbols-outlined text-[90px] text-white">
          cloud
        </span>
      </div>

      <div class="cloud cloud-two">
        <span class="material-symbols-outlined text-[120px] text-white">
          cloud
        </span>
      </div>

      <!-- Flying airplane -->
      <div class="plane absolute top-[18%] left-0 flex items-center gap-3">
        <div class="flight-line"></div>

        <span
          class="material-symbols-outlined text-4xl text-blue-600 rotate-[-10deg]"
        >
          flight
        </span>
      </div>
    </div>

    <!-- React App -->
    <div id="root" class="page-enter"></div>

    <!-- Scroll indicator -->
    <div
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none"
    >
      <div
        class="flex flex-col items-center gap-1 text-gray-500 text-xs"
      >
        <span>Explore</span>

        <span
          class="scroll-dot material-symbols-outlined text-lg"
        >
          keyboard_arrow_down
        </span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
